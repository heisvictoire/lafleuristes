<section class="cta" id="contact">
  <div class="wrap cta-in">
    <div>
      <span class="eye" style="--slash:var(--ink)"><i>/</i>&nbsp;<span data-t="cta.eyebrow"></span></span>
      <h2 class="display" data-tbr="cta.title"></h2>
      <p class="prose" data-t="cta.text"></p>
    </div>
    <div class="cta-actions">
      <a class="btn" data-href="contact.formUrl" href="#" target="_blank" rel="noopener" style="--btn-accent:var(--ink)">
        <span data-t="cta.ctaLabel">Formulaire d'inscription</span>
        <span class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="#FBFAF7" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
      <a class="cta-phone" data-tel href="#"><span data-t="contact.phoneDisplay"></span></a>
      <a class="cta-web" data-href="contact.website" href="#" target="_blank" rel="noopener"><span data-t="contact.websiteLabel"></span></a>
    </div>
  </div>
</section>
