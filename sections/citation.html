<section class="quote">
  <video class="quote-media" autoplay muted loop playsinline preload="metadata" data-poster="citation.poster" aria-hidden="true">
    <source data-src="citation.video" src="" type="video/mp4">
  </video>
  <div class="quote-scrim"></div>
  <div class="quote-inner">
    <span class="eye on-dark" style="--slash:var(--marigold)"><i>/</i>&nbsp;<span data-t="citation.eyebrow"></span></span>
    <blockquote class="display" data-t="citation.quote"></blockquote>
    <cite data-t="citation.cite"></cite>
  </div>
</section>
