<dialog class="modal" id="occModal" aria-labelledby="occTitle">
  <button type="button" class="modal-close" data-close aria-label="Fermer">&times;</button>
  <div class="modal-in">
    <span class="eye" id="occEye" style="--slash:var(--gold)"><i>/</i>&nbsp;Occasion</span>
    <h3 id="occTitle"></h3>
    <p id="occText"></p>
    <a class="btn" id="occCta" href="#" target="_blank" rel="noopener" style="--btn-accent:var(--gold)">Commander sur WhatsApp
      <span class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
  </div>
</dialog>

<dialog class="lightbox" id="lightbox" aria-label="Photo agrandie">
  <button type="button" class="modal-close" data-close aria-label="Fermer">&times;</button>
  <figure style="margin:0">
    <img id="lightboxImg" src="" alt="">

  </figure>
