<section class="hero" id="bouquets">
  <div class="wrap">
    <div class="hero-grid">
      <div class="hero-head" data-accent="hero.eyebrowAccent">
        <span class="eye"><i>/</i>&nbsp;<span data-t="hero.eyebrow"></span></span>
        <h1 class="display" data-tbr="hero.title"></h1>
        <div class="hero-actions">
          <a class="btn" data-href="hero.ctaHref" href="#contact" style="--btn-accent:var(--gold)">
            <span data-t="hero.ctaLabel">Commander</span>
            <span class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </a>
          <a class="tlink" data-href="hero.linkHref" href="#ateliers">
            <span data-t="hero.linkLabel">Découvrir l'atelier</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </div>
      <div class="hero-aside">
        <p class="prose" data-t="hero.aside"></p>
        <span class="eye" style="--slash:var(--marigold)"><i>/</i>&nbsp;<span data-t="hero.asideEyebrow"></span></span>
      </div>
    </div>
  </div>
  <div class="band">
    <video class="band-media" autoplay muted loop playsinline preload="metadata" data-poster="hero.poster" aria-label="Compositions florales de La.Fleuriste">
      <source data-src="hero.video" src="" type="video/mp4">
    </video>
    <a class="tab" data-href="hero.tabHref" href="#contact">
      <span data-t="hero.tabLabel">Commander un bouquet</span>
      <span class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
  </div>
</section>
