<section class="affiche" id="affiche">
  <div class="wrap affiche-in">
    <div class="affiche-text" data-accent="affiche.eyebrowAccent">
      <span class="eye"><i>/</i>&nbsp;<span data-t="affiche.eyebrow"></span></span>
      <h2 class="display" data-tbr="affiche.title"></h2>
      <p class="prose" data-t="affiche.note"></p>
      <a class="btn" data-href="contact.formUrl" href="#" target="_blank" rel="noopener" style="--btn-accent:var(--gold)">
        <span data-t="affiche.ctaLabel">Réserver ma place</span>
        <span class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
    </div>
    <figure class="affiche-visual" id="afficheVisual" tabindex="0" role="button" aria-label="Agrandir l'affiche">
      <img data-src="affiche.image" src="" alt="" data-alt="affiche.imageAlt" loading="lazy">
      <span class="sq" style="--accent:var(--gold)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M7 17 17 7M9 7h8v8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </figure>
  </div>
</section>
